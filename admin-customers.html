<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Customers | Bank of America Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #f0f2f5; }
    .sidebar { position:fixed;left:0;top:0;bottom:0;width:224px;background:var(--navy);z-index:100;overflow-y:auto;display:flex;flex-direction:column; }
    .sidebar-logo { display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,0.1); }
    .sl-box { background:var(--red);width:32px;height:32px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;font-family:var(--font-serif);flex-shrink:0; }
    .sl-text { color:#fff;line-height:1.2; }
    .sl-text strong { display:block;font-size:13px;font-weight:700; }
    .sl-text span { font-size:10px;color:rgba(255,255,255,0.45); }
    .sb-section { font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,0.35);padding:16px 16px 6px;font-weight:700; }
    .sb-nav a { display:flex;align-items:center;gap:10px;padding:10px 16px;color:rgba(255,255,255,0.72);font-size:13px;border-left:3px solid transparent;transition:all .15s;text-decoration:none!important; }
    .sb-nav a:hover,.sb-nav a.active { background:rgba(255,255,255,0.08);color:#fff;border-left-color:var(--red); }
    .sb-bottom { margin-top:auto;padding:16px;border-top:1px solid rgba(255,255,255,0.1); }
    .sb-logout { width:100%;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.15);padding:8px 12px;border-radius:var(--radius);font-size:12px;cursor:pointer;font-family:var(--font-body);text-align:left;transition:all .15s; }
    .sb-logout:hover { background:rgba(255,255,255,0.16);color:#fff; }
    .main-wrap { margin-left:224px;min-height:100vh; }
    .topbar { background:#fff;border-bottom:1px solid #e0e0e0;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50; }
    .topbar h1 { font-size:18px;font-weight:700;color:var(--navy);margin:0; }
    .main-content { padding:24px; }

    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
    }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: #fff; border: 1px solid #ddd; border-radius: var(--radius);
      padding: 7px 12px; flex: 1; max-width: 320px;
    }
    .search-box input { border: none; outline: none; font-size: 13px; font-family: var(--font-body); width: 100%; }

    .panel { background:#fff;border:1px solid #e0e0e0;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm); }
    .panel-head { padding:14px 18px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between; }
    .panel-head h2 { font-size:15px;font-weight:700;color:var(--navy);margin:0; }

    .cust-table { width:100%;border-collapse:collapse; }
    .cust-table th { background:#f7f7f7;text-align:left;padding:10px 14px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#aaa;font-weight:700;border-bottom:2px solid #eee;white-space:nowrap; }
    .cust-table td { padding:12px 14px;border-bottom:1px solid #f5f5f5;font-size:13px;vertical-align:middle; }
    .cust-table tbody tr:hover td { background:#fafafa; }
    .cust-table tbody tr:last-child td { border-bottom:none; }
    .u-cell { display:flex;align-items:center;gap:10px; }
    .u-av { width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
    .u-nm { font-weight:700;color:#222;font-size:13px; }
    .u-em { font-size:11px;color:#bbb; }
    .acct-chip { font-family:monospace;font-size:11.5px;background:#f5f5f5;padding:2px 8px;border-radius:3px;color:#777; }
    .tx-count { background:#eef2ff;color:#4338ca;padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:700; }
    .tx-count.full { background:#fdecea;color:#c62828; }
    .tx-count.warn { background:#fff8e1;color:#9a7000; }
    .action-group { display:flex;gap:6px; }
    .btn-edit { background:var(--mid-blue);color:#fff;border:none;padding:5px 12px;border-radius:var(--radius);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-body);text-decoration:none!important;display:inline-block; }
    .btn-toggle-on  { background:#fff;border:1px solid #c62828;color:#c62828;padding:5px 10px;border-radius:var(--radius);font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--font-body); }
    .btn-toggle-off { background:#fff;border:1px solid #2e7d32;color:#2e7d32;padding:5px 10px;border-radius:var(--radius);font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--font-body); }

    .pagination-row { display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:#f9f9f9;border-top:1px solid #eee;font-size:12px;color:#888; }
    .page-btns { display:flex;gap:4px; }
    .page-btn { border:1px solid #ccc;background:#fff;padding:4px 11px;border-radius:3px;font-size:12px;cursor:pointer;color:#555;font-family:var(--font-body); }
    .page-btn.active { background:var(--navy);color:#fff;border-color:var(--navy); }

    @media (max-width:768px) { .sidebar{display:none;} .main-wrap{margin-left:0;} }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo"><div class="sl-box">B</div><div class="sl-text"><strong>Bank of America</strong><span>Admin Panel</span></div></div>
  <div class="sb-section">Main</div>
  <nav class="sb-nav">
    <a href="admin-dashboard.html"><span>📊</span> Dashboard</a>
    <a href="admin-customers.html" class="active"><span>👥</span> Customers</a>
    <a href="admin-transactions.html"><span>💳</span> All Transactions</a>
  </nav>
  <div class="sb-bottom">
    <button class="sb-logout" onclick="handleLogout()">🚪 Sign Out</button>
  </div>
</aside>

<div class="main-wrap">
  <div class="topbar">
    <h1>Manage Customers</h1>
    <div style="font-size:12px;color:#aaa;" id="cust-count"></div>
  </div>
  <div class="main-content">

    <div class="toolbar">
      <div class="search-box">
        🔍 <input type="text" id="search-inp" placeholder="Search by name, email, account…" oninput="renderTable()">
      </div>
      <select id="filter-status" onchange="renderTable()" style="border:1px solid #ddd;border-radius:var(--radius);padding:7px 12px;font-size:13px;font-family:var(--font-body);background:#fff;">
        <option value="all">All Statuses</option>
        <option value="active">Active Only</option>
        <option value="inactive">Inactive Only</option>
      </select>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Customer Accounts</h2>
        <span style="font-size:12px;color:#aaa;">Click Edit to manage a customer's full profile</span>
      </div>
      <table class="cust-table">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Account Number</th>
            <th>Account Type</th>
            <th>Balance</th>
            <th>Transactions</th>
            <th>Member Since</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="cust-tbody"></tbody>
      </table>
      <div class="pagination-row">
        <span id="page-info"></span>
        <div class="page-btns" id="page-btns"></div>
      </div>
    </div>

  </div>
</div>

<script src="js/shared.js"></script>
<script>
  if (!Auth.requireAdmin()) {}

  let allCustomers = DB.getUsers().filter(u => u.role === 'customer');
  const PER_PAGE = 10;
  let currentPage = 1;

  function getFiltered() {
    const s = document.getElementById('search-inp').value.toLowerCase();
    const f = document.getElementById('filter-status').value;
    let list = DB.getUsers().filter(u => u.role === 'customer');
    if (s) list = list.filter(u =>
      u.name.toLowerCase().includes(s) ||
      u.email.toLowerCase().includes(s) ||
      (u.accountNumber||'').includes(s)
    );
    if (f === 'active')   list = list.filter(u => u.isActive);
    if (f === 'inactive') list = list.filter(u => !u.isActive);
    return list;
  }

  function renderTable() {
    currentPage = 1; renderPage();
  }

  function renderPage() {
    const filtered = getFiltered();
    const total    = filtered.length;
    const pages    = Math.max(1, Math.ceil(total / PER_PAGE));
    const start    = (currentPage - 1) * PER_PAGE;
    const slice    = filtered.slice(start, start + PER_PAGE);

    document.getElementById('cust-count').textContent = `${total} customer${total!==1?'s':''}`;

    const tbody = document.getElementById('cust-tbody');
    tbody.innerHTML = slice.map(u => {
      const txCount = u.transactions.length;
      const txClass = txCount >= 13 ? 'full' : txCount >= 10 ? 'warn' : '';
      return `<tr>
        <td><div class="u-cell">
          <div class="u-av">${Fmt.initials(u.name)}</div>
          <div><div class="u-nm">${u.name}</div><div class="u-em">${u.email}</div></div>
        </div></td>
        <td><span class="acct-chip">${u.accountNumber ? '••••'+u.accountNumber.slice(-4) : '—'}</span></td>
        <td style="font-size:12px;color:#666;">${u.accountType}</td>
        <td>
          <div style="font-weight:700;color:var(--navy);">${Fmt.money(u.balance)}</div>
          <div style="font-size:11px;color:#bbb;">Avail: ${Fmt.money(u.availableBalance)}</div>
        </td>
        <td><span class="tx-count ${txClass}">${txCount}/13</span></td>
        <td style="font-size:12px;color:#888;">${u.memberSince ? new Date(u.memberSince).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'}</td>
        <td><span class="badge ${u.isActive?'badge-green':'badge-red'}">${u.isActive?'● Active':'○ Inactive'}</span></td>
        <td><div class="action-group">
          <a href="admin-edit-customer.html?id=${u.id}" class="btn-edit">Edit</a>
          <button class="${u.isActive?'btn-toggle-on':'btn-toggle-off'}" onclick="toggleUser(${u.id})">
            ${u.isActive ? 'Disable' : 'Enable'}
          </button>
        </div></td>
      </tr>`;
    }).join('');

    document.getElementById('page-info').textContent =
      total===0 ? 'No results' : `Showing ${start+1}–${Math.min(start+PER_PAGE,total)} of ${total}`;

    const btnWrap = document.getElementById('page-btns');
    btnWrap.innerHTML = '';
    for (let p=1;p<=pages;p++) {
      const b = document.createElement('button');
      b.className = 'page-btn'+(p===currentPage?' active':'');
      b.textContent = p;
      b.onclick = () => { currentPage=p; renderPage(); };
      btnWrap.appendChild(b);
    }
  }

  function toggleUser(id) {
    const u = DB.getUserById(id);
    const newStatus = !u.isActive;
    DB.updateUser(id, { isActive: newStatus });
    showToast(`Account ${newStatus?'activated':'deactivated'} successfully.`, newStatus?'success':'error');
    renderPage();
  }

  renderTable();
</script>
</body>
</html>
