<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Transactions | Bank of America Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #f0f2f5; }
    .sidebar { position:fixed;left:0;top:0;bottom:0;width:224px;background:var(--navy);z-index:100;overflow-y:auto;display:flex;flex-direction:column; }
    .sidebar-logo { display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,0.1); }
    .sl-box { background:var(--red);width:32px;height:32px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;font-family:var(--font-serif);flex-shrink:0; }
    .sl-text { color:#fff;line-height:1.2; }
    .sl-text strong { display:block;font-size:13px;font-weight:700; }
    .sl-text span { font-size:10px;color:rgba(255,255,255,0.45); }
    .sb-section { font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,0.35);padding:16px 16px 6px;font-weight:700; }
    .sb-nav a { display:flex;align-items:center;gap:10px;padding:10px 16px;color:rgba(255,255,255,0.72);font-size:13px;border-left:3px solid transparent;transition:all .15s;text-decoration:none!important; }
    .sb-nav a:hover,.sb-nav a.active { background:rgba(255,255,255,0.08);color:#fff;border-left-color:var(--red); }
    .sb-bottom { margin-top:auto;padding:16px;border-top:1px solid rgba(255,255,255,0.1); }
    .sb-logout { width:100%;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.15);padding:8px 12px;border-radius:var(--radius);font-size:12px;cursor:pointer;font-family:var(--font-body);text-align:left; }
    .sb-logout:hover { background:rgba(255,255,255,0.16);color:#fff; }
    .main-wrap { margin-left:224px;min-height:100vh; }
    .topbar { background:#fff;border-bottom:1px solid #e0e0e0;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50; }
    .topbar h1 { font-size:18px;font-weight:700;color:var(--navy);margin:0; }
    .main-content { padding:24px; }

    .stats-row { display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px; }
    .stat-mini { background:#fff;border:1px solid #e0e0e0;border-radius:var(--radius-lg);padding:16px;border-left:4px solid;animation:fadeUp 0.3s ease both; }
    .stat-mini-label { font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#aaa;margin-bottom:4px; }
    .stat-mini-val   { font-size:22px;font-weight:700;color:var(--navy);font-family:var(--font-serif); }

    .toolbar { display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap; }
    .search-box { display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #ddd;border-radius:var(--radius);padding:7px 12px;flex:1;max-width:300px; }
    .search-box input { border:none;outline:none;font-size:13px;font-family:var(--font-body);width:100%; }
    .filter-sel { border:1px solid #ddd;border-radius:var(--radius);padding:7px 12px;font-size:13px;font-family:var(--font-body);background:#fff;color:#333; }

    .panel { background:#fff;border:1px solid #e0e0e0;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);animation:fadeUp 0.35s ease both; }
    .panel-head { padding:14px 18px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between; }
    .panel-head h2 { font-size:15px;font-weight:700;color:var(--navy);margin:0; }

    .tx-table { width:100%;border-collapse:collapse; }
    .tx-table th { background:#f7f7f7;text-align:left;padding:10px 13px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#aaa;font-weight:700;border-bottom:2px solid #eee;white-space:nowrap; }
    .tx-table td { padding:11px 13px;border-bottom:1px solid #f5f5f5;font-size:13px;vertical-align:middle; }
    .tx-table tbody tr:hover td { background:#fafafa; }
    .tx-table tbody tr:last-child td { border-bottom:none; }

    .ref-tag { font-family:monospace;font-size:10.5px;background:#f5f5f5;padding:2px 6px;border-radius:3px;color:#888; }
    .cat-chip { display:inline-block;background:#eef2ff;color:#4338ca;font-size:10.5px;padding:2px 8px;border-radius:9px;text-transform:capitalize; }
    .u-cell { font-weight:600;color:#222;font-size:12.5px; }
    .u-email { font-size:11px;color:#bbb; }
    .date-main { font-size:12px;color:#777;white-space:nowrap; }
    .date-time { font-size:11px;color:#bbb; }
    .status-done { color:#2e7d32;font-size:11px;font-weight:700; }
    .tx-amt-col { font-weight:700;white-space:nowrap;text-align:right; }
    .bal-col { font-size:12px;color:#bbb;text-align:right;white-space:nowrap; }

    .btn-view { background:#fff;border:1px solid var(--mid-blue);color:var(--mid-blue);padding:4px 10px;border-radius:var(--radius);font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--font-body);text-decoration:none!important;display:inline-block; }
    .btn-del  { background:#fff;border:1px solid var(--red);color:var(--red);padding:4px 10px;border-radius:var(--radius);font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--font-body); }
    .btn-del:hover { background:var(--red);color:#fff; }

    .pagination-row { display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:#f9f9f9;border-top:1px solid #eee;font-size:12px;color:#888; }
    .page-btns { display:flex;gap:4px; }
    .page-btn { border:1px solid #ccc;background:#fff;padding:4px 11px;border-radius:3px;font-size:12px;cursor:pointer;color:#555;font-family:var(--font-body); }
    .page-btn.active { background:var(--navy);color:#fff;border-color:var(--navy); }
    .page-btn:hover:not(.active) { background:#f0f0f0; }

    .empty-state { padding:60px;text-align:center;color:#bbb; }

    @media (max-width:1100px) { .stats-row { grid-template-columns:1fr 1fr; } }
    @media (max-width:768px)  { .sidebar{display:none;} .main-wrap{margin-left:0;} }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo"><div class="sl-box">B</div><div class="sl-text"><strong>Bank of America</strong><span>Admin Panel</span></div></div>
  <div class="sb-section">Main</div>
  <nav class="sb-nav">
    <a href="admin-dashboard.html"><span>📊</span> Dashboard</a>
    <a href="admin-customers.html"><span>👥</span> Customers</a>
    <a href="admin-transactions.html" class="active"><span>💳</span> All Transactions</a>
  </nav>
  <div class="sb-bottom"><button class="sb-logout" onclick="handleLogout()">🚪 Sign Out</button></div>
</aside>

<div class="main-wrap">
  <div class="topbar">
    <h1>All Transactions</h1>
    <span id="total-label" style="font-size:12px;color:#aaa;"></span>
  </div>
  <div class="main-content">

    <div class="stats-row" id="stats-row"></div>

    <div class="toolbar">
      <div class="search-box">🔍 <input type="text" id="search-inp" placeholder="Search description, customer, ref…" oninput="renderTable()"></div>
      <select class="filter-sel" id="filter-type" onchange="renderTable()">
        <option value="all">All Types</option>
        <option value="credit">Credits Only</option>
        <option value="debit">Debits Only</option>
      </select>
      <select class="filter-sel" id="filter-cat" onchange="renderTable()">
        <option value="all">All Categories</option>
        <option value="payroll">Payroll</option>
        <option value="transfer">Transfer</option>
        <option value="groceries">Groceries</option>
        <option value="dining">Dining</option>
        <option value="shopping">Shopping</option>
        <option value="utilities">Utilities</option>
        <option value="healthcare">Healthcare</option>
        <option value="gas">Gas</option>
        <option value="atm">ATM</option>
        <option value="subscription">Subscription</option>
      </select>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Transaction Ledger</h2>
        <span style="font-size:12px;color:#aaa;">System-wide activity across all accounts</span>
      </div>
      <table class="tx-table">
        <thead>
          <tr>
            <th>Reference</th>
            <th>Customer</th>
            <th>Description</th>
            <th>Category</th>
            <th>Date</th>
            <th>Type</th>
            <th>Status</th>
            <th style="text-align:right;">Amount</th>
            <th style="text-align:right;">Balance After</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tx-tbody"></tbody>
      </table>
      <div class="pagination-row">
        <span id="page-info"></span>
        <div class="page-btns" id="page-btns"></div>
      </div>
    </div>

  </div>
</div>

<script src="js/shared.js"></script>
<script>
  if (!Auth.requireAdmin()) {}

  const PER_PAGE = 15;
  let currentPage = 1;

  function getAllTx() {
    const users = DB.getUsers().filter(u => u.role==='customer');
    const all = [];
    users.forEach(u => {
      u.transactions.forEach(tx => all.push({ ...tx, userName: u.name, userEmail: u.email, userId: u.id }));
    });
    all.sort((a,b) => new Date(b.date||b.transaction_date) - new Date(a.date||a.transaction_date));
    return all;
  }

  function buildStats() {
    const all = getAllTx();
    const totalIn  = all.filter(t=>t.type==='credit').reduce((s,t)=>s+t.amount,0);
    const totalOut = all.filter(t=>t.type==='debit').reduce((s,t)=>s+t.amount,0);
    document.getElementById('stats-row').innerHTML = `
      <div class="stat-mini" style="border-left-color:#2e7d32;">
        <div class="stat-mini-label">Total Credits</div>
        <div class="stat-mini-val" style="color:#2e7d32;">${Fmt.money(totalIn)}</div>
      </div>
      <div class="stat-mini" style="border-left-color:var(--red);">
        <div class="stat-mini-label">Total Debits</div>
        <div class="stat-mini-val" style="color:var(--red);">${Fmt.money(totalOut)}</div>
      </div>
      <div class="stat-mini" style="border-left-color:var(--navy);">
        <div class="stat-mini-label">Total Transactions</div>
        <div class="stat-mini-val">${all.length}</div>
      </div>
      <div class="stat-mini" style="border-left-color:#ffa000;">
        <div class="stat-mini-label">Net Flow</div>
        <div class="stat-mini-val" style="font-size:18px;${(totalIn-totalOut)>=0?'color:#2e7d32':'color:var(--red)'};">${Fmt.money(Math.abs(totalIn-totalOut))}</div>
      </div>`;
  }

  function getFiltered() {
    const s    = document.getElementById('search-inp').value.toLowerCase();
    const type = document.getElementById('filter-type').value;
    const cat  = document.getElementById('filter-cat').value;
    let all = getAllTx();
    if (type !== 'all') all = all.filter(t => t.type===type);
    if (cat  !== 'all') all = all.filter(t => t.category===cat);
    if (s) all = all.filter(t =>
      t.description.toLowerCase().includes(s) ||
      t.userName.toLowerCase().includes(s) ||
      (t.ref||'').toLowerCase().includes(s) ||
      (t.counterparty||'').toLowerCase().includes(s)
    );
    return all;
  }

  function renderTable() { currentPage=1; renderPage(); }

  function renderPage() {
    const filtered = getFiltered();
    const total    = filtered.length;
    const pages    = Math.max(1, Math.ceil(total/PER_PAGE));
    const start    = (currentPage-1)*PER_PAGE;
    const slice    = filtered.slice(start, start+PER_PAGE);

    document.getElementById('total-label').textContent = `${total} transaction${total!==1?'s':''}`;

    const tbody = document.getElementById('tx-tbody');
    if (slice.length===0) {
      tbody.innerHTML = `<tr><td colspan="10"><div class="empty-state"><div>📭</div><div>No transactions match your filter.</div></div></td></tr>`;
    } else {
      tbody.innerHTML = slice.map(tx => {
        const isCredit = tx.type==='credit';
        const dt = new Date(tx.date||tx.transaction_date);
        const ref = tx.ref || tx.reference_number || '—';
        return `<tr>
          <td><span class="ref-tag">${ref}</span></td>
          <td><div class="u-cell">${tx.userName}</div><div class="u-email">${tx.userEmail}</div></td>
          <td>
            <div style="font-weight:600;color:#222;font-size:12.5px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${tx.description}</div>
            ${tx.counterparty?`<div style="font-size:11px;color:#bbb;">${tx.counterparty}</div>`:''}
          </td>
          <td><span class="cat-chip">${Fmt.categoryIcon(tx.category)} ${tx.category||'—'}</span></td>
          <td><div class="date-main">${dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
              <div class="date-time">${dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div></td>
          <td><span class="badge ${isCredit?'badge-green':'badge-red'}">${isCredit?'Credit':'Debit'}</span></td>
          <td><span class="status-done">✓ Completed</span></td>
          <td class="tx-amt-col ${isCredit?'amt-credit':'amt-debit'}">${isCredit?'+':'-'}${Fmt.money(tx.amount)}</td>
          <td class="bal-col">${tx.balanceAfter!=null?Fmt.money(tx.balanceAfter):'—'}</td>
          <td>
            <div style="display:flex;gap:5px;">
              <a href="admin-edit-customer.html?id=${tx.userId}" class="btn-view">View</a>
              <button class="btn-del" onclick="deleteTx(${tx.userId},${tx.id})" title="Delete &amp; reverse balance">Del</button>
            </div>
          </td>
        </tr>`;
      }).join('');
    }

    document.getElementById('page-info').textContent =
      total===0 ? 'No results' : `Showing ${start+1}–${Math.min(start+PER_PAGE,total)} of ${total}`;

    const btnWrap = document.getElementById('page-btns');
    btnWrap.innerHTML = '';
    const maxBtns = Math.min(pages, 8);
    for (let p=1;p<=maxBtns;p++) {
      const b = document.createElement('button');
      b.className='page-btn'+(p===currentPage?' active':'');
      b.textContent=p;
      b.onclick=()=>{ currentPage=p; renderPage(); };
      btnWrap.appendChild(b);
    }
    if (pages>maxBtns) {
      const s = document.createElement('span');
      s.textContent=` … ${pages} pages`; s.style.fontSize='12px'; s.style.color='#aaa'; s.style.padding='0 6px';
      btnWrap.appendChild(s);
    }
  }

  function deleteTx(userId, txId) {
    if (!confirm('Delete this transaction and reverse its balance effect?')) return;
    const u = DB.getUserById(userId);
    const tx = u.transactions.find(t=>t.id===txId);
    if (!tx) { showToast('Transaction not found.','error'); return; }

    const reversal = tx.type==='debit' ? u.balance+tx.amount : u.balance-tx.amount;
    const users = DB.getUsers();
    const idx   = users.findIndex(x=>x.id===userId);
    users[idx].transactions = users[idx].transactions.filter(t=>t.id!==txId);
    users[idx].balance = reversal;
    users[idx].availableBalance = reversal;
    DB.saveUsers(users);

    showToast('Transaction deleted and balance reversed.','success');
    buildStats();
    renderPage();
  }

  buildStats();
  renderTable();
</script>
</body>
</html>
